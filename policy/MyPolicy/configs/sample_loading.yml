# Hole-finding helper (helpers/sample_loading/sample_search.py): takes the left arm when the student opens the
# gripper over the rack with the tube held, finds the hole and pushes the tube in, then hands back. enabled: false = off.
helper:
  enabled: false           # one switch: false = the helper is not built (behaviour identical to no helper)
  module: sample_search
  class: SampleSearch
  env_class: sample_hold.SampleHelperEnv
  platform: avg            # helpers/sample_loading/calib/platform_<platform>.json
  calib_sha256: e1cd3a4b0717e109
